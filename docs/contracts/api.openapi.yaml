  /me/deleted-budgets:
    get:
      tags: [budgets]
      operationId: listDeletedBudgets
      summary: Budgets I own that were deleted in the last 30 days and can still be restored (at most the 20 most recent, newest first).
      x-session: active
      x-budget-role: none
      x-reauth: false
      responses:
        "200":
          description: Deleted budgets, most recently deleted first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletedBudgetList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }
  /me/deleted-budgets/{deletedBudgetId}/restore:
    parameters:
      - $ref: "#/components/parameters/DeletedBudgetId"
    post:
      tags: [budgets]
      operationId: restoreDeletedBudget
      summary: Undo a budget deletion within the 30-day grace period (owner only).
      description: |
        Clears the soft delete. The caller must hold the `owner` membership of the
        deleted budget; anyone else, an unknown ID, a budget that is not deleted,
        or one deleted more than 30 days ago is 404. Memberships, categories,
        plans and transactions come back as they were at deletion. All members
        are emailed. Authorized only through `requireDeletedBudgetOwnership`, which
        yields a `DeletedBudgetScope` (F-36, ADR-0010); the owner's account must not
        be pending deletion. Refused with 422 LIMIT_REACHED when the owner is
        already a member of 10 non-deleted budgets, or when restoring would put
        any other member of the budget above the hard bound of 20 non-deleted
        budgets (F-37). The response never says which member. Soft-deleted
        budgets do not count toward either limit.
      security:
        - sessionCookie: []
          csrfToken: []
      x-session: active
      x-budget-role: deleted_budget_owner
      x-reauth: false
      x-error-codes: [NOT_FOUND, LIMIT_REACHED]
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Budget" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        default: { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- data rights
  /me/export:
    post:
      tags: [data-rights]
      operationId: exportMyData
      summary: CSV export of every budget I am a member of.
      description: |
        `kind: transactions` returns one row per split; `kind: plans` one row per
        plan entry. Columns are defined in data-model.md "CSV export". Cells that
        start with `=`, `+`, `-`, `@`, tab or CR are prefixed with `'`.
      security:
        - sessionCookie: []
          csrfToken: []
      x-session: active
      x-budget-role: none
      x-reauth: true
      x-pending-deletion-allowed: true
      x-rate-limit: [export]
      x-error-codes: [REAUTH_REQUIRED]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportRequest" }
      responses:
        "200":
          description: CSV file (RFC 4180, UTF-8, header row)
          headers:
            Content-Disposition:
              description: '`attachment; filename="shoestring-<kind>-<YYYY-MM-DD>.csv"`'
              schema: { type: string }
          content:
            text/csv:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
  /me/deletion:
    post:
      tags: [data-rights]
      operationId: requestAccountDeletion
      summary: Schedule account deletion (30-day grace), revoke all sessions.
      description: |
        Blocked with 409 OWNS_SHARED_BUDGET while the user owns a non-deleted
        budget that has other members: transfer ownership, remove the members, or
        delete the budget first. Locks the owned budgets (data-model.md). On
        success every session, including this one, is revoked, every open one-time
        token is deleted, and the cookie is cleared.
      security:
        - sessionCookie: []
          csrfToken: []
      x-session: active
      x-budget-role: none
      x-reauth: true
      x-error-codes: [REAUTH_REQUIRED, OWNS_SHARED_BUDGET]
      responses:
        "202":
          description: Deletion scheduled
          headers:
            Set-Cookie: { $ref: "#/components/headers/ClearSessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletionStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [data-rights]
      operationId: cancelAccountDeletion
      summary: Cancel a scheduled deletion during the grace period.
      security:
        - sessionCookie: []
          csrfToken: []
      x-session: active
      x-budget-role: none
      x-reauth: false
      x-pending-deletion-allowed: true
      x-error-codes: [NOT_FOUND]
      responses:
        "200":
          description: Deletion cancelled; account active again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- budgets
  /budgets:
    get:
      tags: [budgets]
      operationId: listBudgets
      summary: Budgets I am a member of.
      x-session: active
      x-budget-role: none
