openapi: 3.1.0
info:
  title: Shoestring API
  version: 0.1.0
  description: |
    The HTTP contract between the Shoestring SPA and the backend. Contract-first:
    this file is the source of truth; backend zod schemas and the generated
    frontend client must match it. Read with auth.md, errors.md, data-model.md.

    Global rules (apply to every operation; not repeated per operation):
    - Served same-origin under `/api` on `https://shoestring.<domain>`. No CORS.
    - Request and response bodies are `application/json` (UTF-8) unless stated.
      Unsafe requests with a body must send `Content-Type: application/json` (else 415).
    - Every request may send `X-Request-Id`; every response (success or error)
      returns `X-Request-Id`. See errors.md.
    - Every response sets `Cache-Control: no-store`.
    - Unknown request fields are rejected (`additionalProperties: false`) with
      400 VALIDATION_FAILED. Responses never contain fields not listed here.
    - Money is integer USD cents. Dates are `YYYY-MM-DD` calendar dates. Months
      are `YYYY-MM`. Timestamps are RFC 3339 UTC with `Z`.
    - Error responses use ErrorBody. The codes each operation can return beyond
      the implicit set in errors.md are listed in `x-error-codes`.

    Operation extensions (machine-readable; contract and permission tests use them):
    - `x-session`: `none` (public; any session cookie is ignored), `optional`,
      `mfa_pending` (only a session awaiting MFA), `active` (fully signed in),
      `active_or_mfa_pending`.
    - `x-budget-role`: `none` (not budget-scoped), `member` (owner or member),
      `owner`, or `deleted_budget_owner` (owner of a soft-deleted budget inside its
      30-day restore window, via `DeletedBudgetScope`). Non-members get 404. Stated
      on **every** operation; required to be `member` or `owner` on every path
      containing `{budgetId}`, and `deleted_budget_owner` on every path containing
      `{deletedBudgetId}` (and only there).
    - `x-reauth`: `true` means the session must have re-authenticated in the last
      10 minutes. Stated on every operation (`false` when not required).
    - `x-pending-deletion-allowed: true`: callable while the account is pending deletion.
    - `x-idempotency: required`: the `Idempotency-Key` header is required.
    - `x-rate-limit`: list of rate-limit rows in auth.md §14 that apply (beyond `global` and `writes`).
servers:
  - url: /api
security:
  - sessionCookie: []
tags:
  - name: health
  - name: auth
  - name: me
  - name: mfa
  - name: sessions
  - name: budgets
  - name: members
  - name: invitations
  - name: categories
  - name: plans
  - name: summary
  - name: transactions
  - name: data-rights

paths:
  # ---------------------------------------------------------------- health
  /healthz:
    get:
      tags: [health]
      operationId: getHealthz
      summary: Liveness. Process is up; does not touch the database.
      security: []
      x-session: none
      x-budget-role: none
      x-reauth: false
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        default: { $ref: "#/components/responses/Error" }
  /readyz:
    get:
      tags: [health]
      operationId: getReadyz
      summary: Readiness. Database reachable within 1 s and migrations applied.
      security: []
      x-session: none
      x-budget-role: none
      x-reauth: false
      x-error-codes: [UNAVAILABLE]
      responses:
        "200":
          description: Ready to serve traffic
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- auth
  /auth/session:
    get:
      tags: [auth]
      operationId: getAuthSession
      summary: Current auth state and CSRF token. The SPA calls this on boot.
      x-session: active_or_mfa_pending
      x-budget-role: none
      x-reauth: false
      x-pending-deletion-allowed: true
      responses:
        "200":
          description: Signed in, or awaiting MFA
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/Error" }
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Email + password. Returns `mfa_required` if the user has MFA.
      description: |
        Sets a new session cookie (any existing session on this browser is revoked).
        If the user has MFA, the new session is `mfa_pending` (10-minute lifetime)
        and only the MFA endpoints accept it. Password hashing is queued behind a
        per-instance limit; if the queue wait exceeds 2 s the answer is 503
        UNAVAILABLE with Retry-After (auth.md §7). Signup, reauth and password
        changes share the same queue.
      security: []
      x-session: none
      x-budget-role: none
      x-reauth: false
      x-rate-limit: [login]
      x-error-codes: [INVALID_CREDENTIALS]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Authenticated, or MFA step required
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetSessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current session and clear the cookie. Always 204.
      security:
        - {}
        - sessionCookie: []
          csrfToken: []
      x-session: optional
      x-budget-role: none
      x-reauth: false
      x-pending-deletion-allowed: true
      responses:
        "204":
          description: Signed out (also when there was no session)
          headers:
            Set-Cookie: { $ref: "#/components/headers/ClearSessionCookie" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }
  /auth/mfa/verify:
    post:
      tags: [auth, mfa]
      operationId: verifyMfa
      summary: Complete sign-in with a second factor.
      description: |
        On success the session becomes `active`, its token is rotated (new cookie)
        and a new CSRF token is returned. After 5 failures the pending session is
        deleted and the user must sign in again.
      security:
        - sessionCookie: []
          csrfToken: []
      x-session: mfa_pending
      x-budget-role: none
      x-reauth: false
      x-pending-deletion-allowed: true
      x-rate-limit: [mfa-verify, mfa-failures]
      x-error-codes: [MFA_FAILED, FORBIDDEN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaProof" }
      responses:
        "200":
          description: Signed in
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetSessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
  /auth/webauthn/challenge:
    post:
      tags: [auth, mfa]
      operationId: createWebAuthnChallenge
      summary: Passkey assertion options for the MFA step or for re-authentication.
      description: |
        `purpose: mfa` requires an `mfa_pending` session; `purpose: reauth` requires
        an `active` session (else 403 FORBIDDEN). One outstanding challenge per
        session; a new call replaces it. Challenges expire after 5 minutes.
        If the user has no passkeys, returns 409 MFA_NOT_ENABLED.
      security:
        - sessionCookie: []
          csrfToken: []
      x-session: active_or_mfa_pending
      x-budget-role: none
      x-reauth: false
      x-pending-deletion-allowed: true
      x-rate-limit: [mfa-verify, mfa-failures]
      x-error-codes: [FORBIDDEN, MFA_NOT_ENABLED]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebAuthnChallengeRequest" }
      responses:
        "200":
          description: PublicKeyCredentialRequestOptionsJSON
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebAuthnRequestOptions" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
  /auth/reauth:
    post:
      tags: [auth]
      operationId: reauthenticate
      summary: Step-up for sensitive actions. Password, plus a second factor if enrolled.
      description: |
        Opens a 10-minute re-authentication window on the current session.
        If the user has MFA and `mfa` is omitted, returns 401 MFA_REQUIRED.
      security:
        - sessionCookie: []
          csrfToken: []
      x-session: active
      x-budget-role: none
      x-reauth: false
      x-pending-deletion-allowed: true
      x-rate-limit: [reauth, mfa-failures]
      x-error-codes: [INVALID_CREDENTIALS, MFA_FAILED]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReauthRequest" }
      responses:
        "200":
          description: Re-authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReauthResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }
  /auth/signup/preview:
    post:
      tags: [auth]
      operationId: previewSignupInvite
      summary: Check a sign-up invite token and show the invited email.
      security: []
      x-session: none
      x-budget-role: none
      x-reauth: false
      x-rate-limit: [signup]
      x-error-codes: [INVITATION_INVALID]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
      responses:
        "200":
          description: Invite is valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignupPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }
  /auth/signup:
    post:
      tags: [auth]
      operationId: signup
      summary: Create an account from a sign-up invite (invite-only registration).
      description: |
        The email comes from the invite, so holding the emailed token verifies it.
        Consumes the invite, creates the user and an `active` session (sets cookie).
      security: []
      x-session: none
      x-budget-role: none
      x-reauth: false
      x-rate-limit: [signup]
      x-error-codes: [INVITATION_INVALID]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupRequest" }
      responses:
        "201":
          description: Account created and signed in
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetSessionCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }
  /auth/password-reset/request:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: Email a reset link if the account exists. Always 202.
      security: []
      x-session: none
      x-budget-role: none
      x-reauth: false
      x-rate-limit: [password-reset-request]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailRequest" }
      responses:
        "202":
          {
            description: "Accepted (identical whether or not the account exists)",
          }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }
  /auth/password-reset/verify:
    post:
      tags: [auth]
      operationId: verifyPasswordResetToken
      summary: Check a reset token and learn whether a second factor will be required.
      security: []
      x-session: none
      x-budget-role: none
      x-reauth: false
      x-rate-limit: [password-reset-complete]
      x-error-codes: [TOKEN_INVALID]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
      responses:
        "200":
          description: Token is valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordResetStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }
  /auth/password-reset/webauthn-challenge:
    post:
      tags: [auth, mfa]
      operationId: createPasswordResetWebAuthnChallenge
      summary: Passkey assertion options bound to a reset token.
      security: []
      x-session: none
      x-budget-role: none
      x-reauth: false
      x-rate-limit: [password-reset-complete]
      x-error-codes: [TOKEN_INVALID, MFA_NOT_ENABLED]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
      responses:
        "200":
          description: PublicKeyCredentialRequestOptionsJSON
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebAuthnRequestOptions" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }
  /auth/password-reset/complete:
    post:
      tags: [auth]
      operationId: completePasswordReset
      summary: Set a new password. Requires a second factor when MFA is enabled.
      description: |
        Never bypasses MFA: if the user has any MFA factor, `mfa` is required
        (401 MFA_REQUIRED if missing, 401 MFA_FAILED if wrong; 5 failures
        invalidate the token). Success consumes the token and revokes all of
        the user's sessions. The user then signs in normally.
      security: []
      x-session: none
      x-budget-role: none
      x-reauth: false
      x-rate-limit: [password-reset-complete, mfa-failures]
      x-error-codes: [TOKEN_INVALID, MFA_FAILED]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetComplete" }
      responses:
        "204": { description: "Password changed; all sessions revoked" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }
  /auth/email-change/confirm:
    post:
      tags: [auth]
      operationId: confirmEmailChange
      summary: Confirm a new email address from the link sent to it (signed in as the same user).
      description: |
        Requires the token **and** an `active` session of the user who requested the
        change (auth.md §9). A token for another user, or one whose requesting
        session has since been revoked, is 400 TOKEN_INVALID. Success swaps the
        email, deletes the user's other open one-time tokens (except
        `email_change_cancel`) and revokes every session except the confirming one.
      security:
        - sessionCookie: []
          csrfToken: []
      x-session: active
      x-budget-role: none
      x-reauth: false
      x-rate-limit: [email-change-confirm]
      x-error-codes: [TOKEN_INVALID]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
      responses:
        "204": { description: "Email changed" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
  /auth/email-change/cancel:
    post:
      tags: [auth]
      operationId: cancelEmailChange
      summary: '"This wasn''t me": cancel or revert an email change from the link sent to the old address.'
      description: |
        Public; the token is the authorization. Valid for 24 hours after the change
        was requested. If the change is still pending it is cancelled; if it was
        already confirmed, the account's email reverts to the address this link
        was sent to (unless another account now uses it: then TOKEN_INVALID).
        Either way: every session is revoked; every open one-time token that is
        not a cancel token is deleted; and, among cancel tokens, only those
        created AFTER this one are deleted. Earlier cancel tokens stay valid, so
        an earlier cancel always wins (F-33). Both addresses (the one restored or
        kept and the one abandoned) are emailed. The user signs in again and
        should reset the password. See auth.md §9 for the regression tests.
      security: []
      x-session: none
      x-budget-role: none
      x-reauth: false
      x-rate-limit: [email-change-confirm]
      x-error-codes: [TOKEN_INVALID]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
      responses:
        "204":
          { description: "Change cancelled or reverted; all sessions revoked" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- me
  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: The signed-in user.
      x-session: active
      x-budget-role: none
      x-reauth: false
      x-pending-deletion-allowed: true
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [me]
      operationId: updateMe
      summary: Update the display name.
      security:
        - sessionCookie: []
          csrfToken: []
      x-session: active
      x-budget-role: none
      x-reauth: false
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }
  /me/password:
    post:
      tags: [me]
      operationId: changePassword
      summary: Change password. Revokes all other sessions.
      security:
        - sessionCookie: []
          csrfToken: []
      x-session: active
      x-budget-role: none
      x-reauth: true
      x-error-codes: [REAUTH_REQUIRED]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChange" }
      responses:
        "204": { description: "Changed" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }
  /me/email-change:
    post:
      tags: [me]
      operationId: requestEmailChange
      summary: Send a confirmation link to a new address; notify the old one.
      description: |
        202, including when the new address belongs to another account. At most
        one email change per 24 h: while the user has any open
        `email_change_cancel` token, the answer is 429 RATE_LIMITED with
        Retry-After until that token expires (F-33).
      security:
        - sessionCookie: []
          csrfToken: []
      x-session: active
      x-budget-role: none
      x-reauth: true
      x-rate-limit: [email-change-request]
      x-error-codes: [REAUTH_REQUIRED]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmailChangeRequest" }
      responses:
        "202": { description: "Accepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- sessions
  /me/sessions:
    get:
      tags: [sessions]
      operationId: listSessions
      summary: The user's active sessions (devices).
      x-session: active
      x-budget-role: none
      x-reauth: false
      responses:
        "200":
          description: Sessions, most recently seen first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }
  /me/sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    delete:
      tags: [sessions]
      operationId: revokeSession
      summary: Revoke one of the user's sessions. Revoking the current one signs out.
      security:
        - sessionCookie: []
          csrfToken: []
      x-session: active
      x-budget-role: none
      x-reauth: false
      x-error-codes: [NOT_FOUND]
      responses:
        "204": { description: "Revoked" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
  /me/sessions/revoke-others:
    post:
      tags: [sessions]
      operationId: revokeOtherSessions
      summary: Sign out everywhere else.
      security:
        - sessionCookie: []
          csrfToken: []
      x-session: active
      x-budget-role: none
      x-reauth: false
      responses:
        "204": { description: "All other sessions revoked" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------- mfa
  /me/mfa:
    get:
      tags: [mfa]
      operationId: getMfa
      summary: MFA factors and recovery-code count.
      x-session: active
      x-budget-role: none
      x-reauth: false
      responses:
        "200":
          description: MFA detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MfaDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
