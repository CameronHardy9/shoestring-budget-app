    post:
      tags: [budgets]
      operationId: createBudget
      summary: Create a budget (caller becomes owner), optionally with starter categories.
      description: |
        Atomic. `plannedCents` on a starter category creates a plan entry for the
        budget's current month (in the budget timezone).
      security:
        - sessionCookie: []
          csrfToken: []
      x-session: active
      x-budget-role: none
