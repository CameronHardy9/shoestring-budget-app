        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [budgets]
      operationId: updateBudget
      summary: Rename or change timezone (owner only).
      security:
        - sessionCookie: []
          csrfToken: []
      x-session: active
      x-reauth: false
      x-budget-role: owner
      x-error-codes: [NOT_FOUND, FORBIDDEN, VERSION_CONFLICT]
      requestBody:
