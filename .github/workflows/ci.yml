name: CI
# Runs exactly the Makefile targets everyone runs locally:
#   check (lint + typecheck + unit) -> e2e, and audit in parallel.
# Every third-party action is pinned to a full commit SHA (Dependabot keeps
# them current). No job reads secrets, and `pull_request` (never
# `pull_request_target`) gives fork PRs a read-only token and no secrets.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# No token permissions by default; each job asks for exactly what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"

jobs:
  check:
    name: check
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: make setup
      - run: make check

  e2e:
    name: e2e
    permissions:
      contents: read
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Cache Playwright browsers
        if: hashFiles('tests/package.json') != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: make setup
      - run: make e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            tests/playwright-report/
            tests/test-results/
          if-no-files-found: ignore
          retention-days: 14

  audit:
    name: audit
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for secret scanning
          persist-credentials: false
      # Scanners run from pinned images and read pnpm-lock.yaml directly, so no
      # Node toolchain or install is needed here.
      - run: make audit

  # Prod-image smoke (ADR-0009): builds (does not push) the production image,
  # then runs it with production-like config, no test hooks and a throwaway
  # Postgres. Skips until backend/ exists. Publishing to a registry is a later
  # release workflow.
  # On main (push or manual run on main; never a pull request, so never a fork)
  # the image's SPA gets its Sentry DSN.
  image:
    name: image
    permissions:
      contents: read
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Public by design (it ships in the bundle), so a variable, not a secret.
      # Job-wide so make image and make image-smoke (which rebuilds if needed)
      # build the same bundle.
      VITE_SENTRY_DSN: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') && vars.SENTRY_DSN_WEB || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make image
      - run: make image-smoke

  # Private source-map upload to Sentry for this commit's release, main only.
  # The token is an environment secret of `sentry` (deployment branches: main),
  # so no other branch or workflow can read it; the job skips cleanly while the
  # secret does not exist. The maps come from the Dockerfile's sourcemaps stage
  # with the same build arguments as the image job; they go only to Sentry,
  # never to a GitHub artifact (artifacts of this public repository are public).
  # When a release workflow publishes the image, this upload moves into that
  # job so the maps come from the published build itself.
  sourcemaps:
    name: sourcemaps
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: sentry
    env:
      VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN_WEB }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Upload source maps to Sentry (private)
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT_WEB: ${{ vars.SENTRY_PROJECT_WEB }}
        run: make sourcemaps-upload
