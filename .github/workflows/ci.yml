name: CI
# Runs exactly the Makefile targets agents run locally.
# ci-engineer: pin every action to a full commit SHA and add toolchain setup steps.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # - toolchain setup (node / python / etc.) with dependency caching
      - run: make setup
      - run: make check

  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: make setup
      - run: make e2e

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history for secret scanning
      - run: make setup
      - run: make audit
