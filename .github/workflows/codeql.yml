name: CodeQL
# Code scanning (free for public repos). Results appear under Security > Code
# scanning. Use this workflow instead of CodeQL "default setup" in the repo
# settings; enabling both makes the uploads conflict.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC: catches new queries on unchanged code
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # CodeQL fails when a language has no source files, which is the case for
      # JavaScript/TypeScript until the first package lands. Skip cleanly until then.
      - name: Detect source files
        id: detect
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          if [ "$LANGUAGE" = "javascript-typescript" ]; then
            count="$(git ls-files '*.ts' '*.tsx' '*.mts' '*.cts' '*.js' '*.jsx' '*.mjs' '*.cjs' | wc -l)"
          else
            count="$(git ls-files '.github/workflows/*.yml' '.github/workflows/*.yaml' '**/action.yml' | wc -l)"
          fi
          echo "files=$count" >> "$GITHUB_OUTPUT"
          echo "$LANGUAGE source files: $count"
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: steps.detect.outputs.files != '0'
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: steps.detect.outputs.files != '0'
        with:
          category: /language:${{ matrix.language }}
