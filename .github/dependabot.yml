# Weekly, grouped dependency updates. Nothing merges automatically: every PR runs
# check, e2e and audit and the owner merges.
# cooldown matches pnpm's minimumReleaseAge (7 days, pnpm-workspace.yaml), so
# Dependabot never proposes a version pnpm would refuse to install.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # On its own because this PR can't pass e2e as opened: it also needs the
      # Playwright image moved by hand (see the docker entry below). Keeping it
      # out of npm-minor-and-patch stops it blocking everything else.
      playwright:
        patterns: ["@playwright/test", playwright-core]
        update-types: [minor, patch]
      npm-minor-and-patch:
        patterns: ["*"]
        exclude-patterns: ["@playwright/test", playwright-core]
        update-types: [minor, patch]
    ignore:
      # Node major upgrades are a deliberate decision (LTS line pinned in .nvmrc).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # Stay on TypeScript 6 until typescript-eslint supports TypeScript 7
      # (owner ruling 2026-11-16, docs/mvp-planning/10 "Build round 5"; PR #11
      # closed). Remove this entry once typescript-eslint's supported range
      # includes 7.x, then upgrade both in one PR.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"

  # Dockerfile, Dockerfile.dev, Dockerfile.backup (alpine) and the pinned tool
  # images in .github/tools/Dockerfile.
  - package-ecosystem: docker
    directories:
      - /
      - /.github/tools
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    cooldown:
      default-days: 7
    groups:
      docker-images:
        patterns: ["*"]
    ignore:
      # Stay on the Node 24 LTS line until the owner decides to move.
      - dependency-name: node
        update-types: [version-update:semver-major]
      # Ignored because the image must equal @playwright/test in tests/package.json,
      # and Dependabot can't change both in one PR (make e2e stops when they
      # differ). To handle a PR from the npm "playwright" group: on our own branch,
      # apply its version bumps AND move the playwright line in .github/tools/Dockerfile
      # to the same vX.Y.Z-noble tag, with the index digest printed by
      #   docker buildx imagetools inspect mcr.microsoft.com/playwright:vX.Y.Z-noble
      # Compare browsers.json in the old and new playwright-core: if the Chromium or
      # WebKit revision changed, the visual baselines may need regenerating.
      - dependency-name: mcr.microsoft.com/playwright
    commit-message:
      prefix: "chore(docker)"

  # Postgres image in docker-compose.yml.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    cooldown:
      default-days: 7
    groups:
      compose-images:
        patterns: ["*"]
    ignore:
      # The Postgres major must match production (sre); upgrade deliberately.
      - dependency-name: postgres
        update-types: [version-update:semver-major]
    commit-message:
      prefix: "chore(docker)"
