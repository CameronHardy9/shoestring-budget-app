# Override for `make test` (Postgres only) and `make e2e` (whole stack).
# Used together with docker-compose.yml under a separate project name
# (shoestring-test / shoestring-e2e), so it never touches your dev data.
# Throwaway database in tmpfs, no seed data, test hooks on, host-only ports.
services:
  postgres:
    volumes: !reset []
    tmpfs:
      - /var/lib/postgresql/data
    # fsync off is safe for a throwaway test database and makes resets fast.
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off

  migrate:
    environment:
      SEED: "0"

  backend:
    environment:
      NODE_ENV: test
      TEST_HOOKS: "1"
      LOG_LEVEL: warn
      # Hermetic: ignore any overrides in a developer's .env. The test outbox
      # backs /api/_test/emails; no HIBP network calls in tests.
      EMAIL_TRANSPORT: test
      HIBP_ENABLED: "false"
      TRUST_PROXY_HOPS: "0"
      WEBAUTHN_RP_NAME: ""
